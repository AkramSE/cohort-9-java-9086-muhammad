spring.application.name=contact-manager
server.port=8080

# Aiven Cloud MySQL Database Connection
spring.datasource.url=jdbc:mysql://mysql-2363b20f-contact-manager-db.d.aivencloud.com:15875/defaultdb?sslMode=REQUIRED
spring.datasource.username=avnadmin
spring.datasource.password=${DB_PASSWORD}

# Hibernate Dialect (MySQL 8 ke liye)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security Configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
jwt.secret=${JWT_SECRET}